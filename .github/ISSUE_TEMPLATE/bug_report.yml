name: Relatar um problema
description: Informe um erro reproduzível no NFiles IA.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o NFiles IA. Não publique tokens, licenças, documentos privados ou caminhos com seu nome de usuário.
  - type: input
    id: version
    attributes:
      label: Versão do NFiles IA
      placeholder: "Exemplo: 8.0.2 Beta"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows
      options:
        - Windows 11
        - Windows 10
        - Outro
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado e o resultado esperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra...
        2. Clique em...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências sem dados pessoais
      description: Arraste prints ou cole mensagens de erro depois de remover tokens, nomes e caminhos privados.
  - type: checkboxes
    id: privacy
    attributes:
      label: Verificação de privacidade
      options:
        - label: Confirmei que não incluí tokens, chaves, licenças ou documentos privados.
          required: true
